name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    # 👇 就是这里！显式声明这个任务拥有创建 Release 的写入权限
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ⚙️ 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 安装 Capacitor 依赖
        run: npm install

      - name: ☕ 设置 Java 17 (Android编译必需)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📁 准备 Web 静态文件 (移动到 www 目录)
        run: |
          mkdir -p www
          cp index.html style.css app.js www/
          
      - name: 🤖 生成 Android 工程并同步代码
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🎨 生成 App 图标与启动页
        run: npx @capacitor/assets generate --android || echo "跳过图标生成"

      - name: 🔨 编译构建 Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 自动发布到仓库 Release 页（直接下载 APK）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 快捷日报 自动构建 v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}